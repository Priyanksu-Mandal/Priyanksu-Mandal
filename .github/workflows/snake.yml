name: Generate Snake Animation

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      # Generate snake animation SVG & GIF
      - name: Generate Snake Game
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: Priyanksu-Mandal
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-light.svg?palette=github-light
            dist/ocean.gif?color_snake=orange&color_dots=#38bdf8,#0284c7,#0369a1,#075985,#0c4a6e

      # Deploy generated assets to the `output` branch
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
