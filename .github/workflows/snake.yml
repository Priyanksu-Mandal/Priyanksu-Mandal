  # Runs automatically every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Also runs on every push to main (so it generates immediately)
  push:
    branches:
      - main
  # Allows you to trigger it manually from the Actions tab
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Generate the snake SVGs from your contribution graph
      - name: Generate Snake Game
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: Priyanksu-Mandal
          # Output files — these match what your README references
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      # Push the generated SVGs to the `output` branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
