name: Deploy Portfolio Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (optional if you need a build step)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (if any)
        run: |
          if [ -f package.json ]; then npm ci; else echo "No package.json, skipping"; fi

      - name: Build site (optional)
        run: |
          if [ -f package.json ]; then npm run build; else echo "No build script defined"; fi

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
